name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck
      # Unit, component, boundary, public-surface and README-example tests.
      - run: bun test
      # Fails if the public API differs from api/*.api.md (the contract), if an entry comes out
      # without the shared core, if JSX targets React's development runtime, or over the size budget.
      - run: bun run build
      - run: bun run lint:package

  # The peer range each package.json declares is tested, not assumed: each cell installs the packed
  # package into a fresh npm project, type-checks a consumer under bundler and node16 resolution,
  # and renders it under Node 20.
  peers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["18", "19"]
    name: peers (react ${{ matrix.react }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run --cwd packages/fingerprint check:consumer ${{ matrix.react }}
